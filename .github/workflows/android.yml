name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: instaytgrabber-debug-keystore-v1
      - name: Ensure stable debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android NDK and native build tools
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          command -v ninja >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ninja-build)
      - name: Build bundled QuickJS-NG runtime
        run: bash .github/scripts/build-quickjs-android.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish latest debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="InstaYtGrabber-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "InstaYtGrabber v${VERSION} Debug" \
            --notes "Latest automatic debug APK from main." \
            --prerelease
